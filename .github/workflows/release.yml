name: ClipQR release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG='${{ inputs.tag }}'; else TAG="$GITHUB_REF_NAME"; fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid release tag: $TAG"; exit 1; fi
          CONFIG_VERSION="$(jq -r '.version' nsh.json)"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [[ "$VERSION" != "$CONFIG_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG must match nsh.json ($CONFIG_VERSION) and package.json ($PACKAGE_VERSION)"
            exit 1
          fi
          git fetch origin main --no-tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git merge-base --is-ancestor "$TAG" origin/main || { echo "Tag must point to main"; exit 1; }
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release commit must be on main"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify-nsh:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install NSH
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - run: nsh check App.tsx
      - run: mkdir -p test-results && nsh test App.test.tsx --junit test-results/nsh.xml
      - run: nsh build App.tsx --release

  verify-website:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install React website dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build React website with Vite
        working-directory: site
        run: bun run build
      - name: Check translations
        run: bun run check:i18n
      - name: Test system language matching
        run: bun run test:site-locale

  package:
    needs: [validate, verify-nsh, verify-website]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: linux
            arch: aarch64
          - runner: macos-latest
            target: macos
            arch: native
          - runner: macos-latest
            target: ios-simulator
            arch: arm64
          - runner: windows-latest
            target: windows
            arch: x86_64
          - runner: ubuntu-24.04
            target: android
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y clang libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android build tools
        if: matrix.target == 'android'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" "ndk;27.2.12479018"
      - name: Install Rust cross-compilation targets
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            android) rustup target add aarch64-linux-android ;;
            ios-simulator) rustup target add aarch64-apple-ios-sim ;;
          esac
      - name: Install NSH (Linux or macOS)
        if: runner.os != 'Windows'
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package app
        shell: bash
        run: nsh package App.tsx --target '${{ matrix.target }}' --app-version '${{ needs.validate.outputs.version }}' --build 1
      - name: Strip Linux executable symbols
        if: matrix.target == 'linux'
        shell: bash
        run: strip --strip-all .nsh/out/ClipQR/ClipQR
      - name: Build Debian, RPM, and AppImage packages
        if: matrix.target == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          APPIMAGE_ARCH: ${{ matrix.arch == 'x86_64' && 'x86_64' || 'aarch64' }}
          NFPM_ARCH: ${{ matrix.arch == 'x86_64' && 'x86_64' || 'arm64' }}
        run: |
          set -euo pipefail
          mkdir -p release-out work/AppDir/usr/share/applications work/AppDir/usr/share/icons/hicolor/1024x1024/apps work/AppDir/opt/clipqr
          mkdir -p work/release-package
          cp .nsh/out/ClipQR/icu.needhelp.clipqr.desktop work/release-package/clipqr.desktop
          cat > work/release-package/clipqr-launcher <<'EOF'
          /opt/clipqr/ClipQR
          EOF
          cat > work/release-package/postinstall.sh <<'EOF'
          #!/bin/sh
          set -e
          install -d /opt/clipqr
          EOF
          cat > work/release-package/postremove.sh <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ]; then
            rm -f /usr/bin/clipqr
          fi
          EOF
          chmod 755 work/release-package/postinstall.sh work/release-package/postremove.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libfuse2
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_${NFPM_ARCH}.tar.gz" -o work/nfpm.tar.gz
          tar -xzf work/nfpm.tar.gz -C work nfpm
          NFPM_ARCH="$NFPM_ARCH" VERSION="$VERSION" work/nfpm package --config nfpm.yaml --packager deb --target "release-out/clipqr_${VERSION}_${ARCH}.deb"
          NFPM_ARCH="$NFPM_ARCH" VERSION="$VERSION" work/nfpm package --config nfpm.yaml --packager rpm --target "release-out/clipqr-${VERSION}-1.${{ matrix.arch }}.rpm"
          cp .nsh/out/ClipQR/ClipQR work/AppDir/opt/clipqr/ClipQR
          cp -a .nsh/out/ClipQR/nsh work/AppDir/opt/clipqr/nsh
          cp site/public/clipqr-icon.png work/AppDir/icu.needhelp.clipqr.png
          cat > work/AppDir/icu.needhelp.clipqr.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ClipQR
          Exec=AppRun %U
          Icon=icu.needhelp.clipqr
          StartupWMClass=icu.needhelp.clipqr
          Terminal=false
          Categories=Utility;
          EOF
          cat > work/AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/opt/clipqr/ClipQR" "$@"
          EOF
          chmod 755 work/AppDir/AppRun
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage" -o work/appimagetool.AppImage
          chmod 755 work/appimagetool.AppImage
          ARCH="$APPIMAGE_ARCH" work/appimagetool.AppImage work/AppDir "release-out/ClipQR-${VERSION}-${APPIMAGE_ARCH}.AppImage"
      - name: Create Apple app archive
        if: matrix.target == 'macos' || matrix.target == 'ios-simulator'
        shell: bash
        run: |
          mkdir -p release-out
          bundle="$(find .nsh/out -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "release-out/ClipQR-${{ matrix.target }}.zip"
      - name: Collect package
        shell: bash
        run: |
          mkdir -p release-out
          if [[ '${{ matrix.target }}' != 'macos' && '${{ matrix.target }}' != 'ios-simulator' ]]; then
            find .nsh/out -maxdepth 3 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' -o -name '*.aab' \) -print -exec cp {} release-out/ \;
          fi
          test -n "$(find release-out -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: clipqr-${{ matrix.target }}-${{ matrix.arch }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          NOTES="ClipQR v$VERSION — Native Shell desktop and mobile builds, Linux .deb/.rpm/.AppImage packages, and a React website. QR decoding stays on-device. Linux packages require GTK 4 and WebKitGTK 6; GNOME tray display requires AppIndicator."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "ClipQR v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "ClipQR v$VERSION" \
              --notes "$NOTES"
          fi
