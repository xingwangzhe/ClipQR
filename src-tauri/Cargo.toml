[package]
name = "clipqr"
version = "0.1.3"
description = "ClipQR - 快捷二维码解析工具"
authors = ["xingwangzhe"]
license = "MIT"
repository = "https://github.com/xingwangzhe/ClipQR"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "clipqr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
image = "0.24"
bardecoder = "0.5"
bitvec = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


[profile.dev]
incremental = true # 以较小的步骤编译二进制文件。

# 最激进的发布构建优化
[profile.release]
opt-level = 3 # 最高级别优化（速度优先）
lto = true # 启用全程序链接时优化
codegen-units = 1 # 单代码单元，最大化优化效果
panic = "abort" # 移除panic展开，减小二进制体积
strip = "symbols" # 移除调试符号，进一步减小体积
