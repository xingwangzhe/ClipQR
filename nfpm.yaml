name: clipqr
arch: '${NFPM_ARCH}'
platform: linux
version: '${VERSION}'
release: '1'
section: utils
priority: optional
maintainer: xingwangzhe <xingwangzhe@outlook.com>
description: Cross-platform QR code reader for clipboard, images, and drag-and-drop.
license: MIT
contents:
  - src: .nsh/out/ClipQR/ClipQR
    dst: /usr/bin/clipqr
    file_info:
      mode: 0755
  - src: .nsh/out/ClipQR/icu.needhelp.clipqr.desktop
    dst: /usr/share/applications/icu.needhelp.clipqr.desktop
  - src: .nsh/out/ClipQR/icu.needhelp.clipqr.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/icu.needhelp.clipqr.png
  - src: .nsh/out/ClipQR/nsh
    dst: /usr/lib/clipqr/nsh
    type: tree
  - src: tray.svg
    dst: /usr/share/icons/hicolor/scalable/apps/icu.needhelp.clipqr.svg
scripts:
  postinstall: work/release-package/postinstall.sh
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
